name: Update grade boundaries
on:
  schedule: [{ cron: '0 5 * * *' }]   # every day at 05:00 UTC
  workflow_dispatch: {}                # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pdfplumber
      - run: python scripts/update_boundaries.py --debug
      - name: Save PDF text if nothing was recognised (for fixing the reader)
        uses: actions/upload-artifact@v4
        with: { name: pdf-text, path: scripts/debug, if-no-files-found: ignore }
      - name: Commit new boundary files
        run: |
          git config user.name "boundary-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tools/assets/gradedata/series
          git diff --cached --quiet || (git commit -m "Add new grade boundaries" && git push)
